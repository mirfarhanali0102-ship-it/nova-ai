<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#090914">
<title>NOVA AI — Your Assistant</title>
<style>
:root{--bg:#090914;--panel:#111121;--panel2:#17172b;--line:#292943;--text:#f4f2ff;--muted:#a6a3c2;--purple:#9b6cff;--cyan:#54d8ff}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 15% 0%,#241344 0,transparent 38%),radial-gradient(ellipse at 90% 85%,#10243a 0,transparent 35%),var(--bg);color:var(--text);font-family:Inter,system-ui,Arial,sans-serif;min-height:100vh}
.app{max-width:1050px;margin:auto;min-height:100vh;display:flex;flex-direction:column;padding:22px}
header{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding:8px 2px 18px}
.brand{display:flex;align-items:center;gap:12px}.logo{width:42px;height:42px;border-radius:14px;background:linear-gradient(135deg,var(--purple),var(--cyan));display:grid;place-items:center;color:#090914;font-weight:900;font-size:21px;box-shadow:0 0 25px #9564ff55}
.brand h1{font-size:18px;letter-spacing:2px;margin:0}.brand small{display:block;color:var(--muted);font-size:11px;letter-spacing:1.5px;margin-top:3px}
.status{font-size:12px;color:#8ce9c1;border:1px solid #285b4c;background:#10251f;padding:7px 11px;border-radius:30px}
main{flex:1;display:flex;flex-direction:column;max-width:790px;width:100%;margin:0 auto;padding:35px 0 20px}
.welcome{text-align:center;margin:10px 0 26px}.orb{width:76px;height:76px;border-radius:25px;margin:0 auto 18px;background:linear-gradient(135deg,#9b6cff,#4bcfff);display:grid;place-items:center;font-size:35px;box-shadow:0 0 55px #8d5aff55}.welcome h2{font-size:clamp(27px,5vw,40px);margin:0 0 9px}.welcome h2 span{background:linear-gradient(90deg,#c59cff,#5ddcff);color:transparent;background-clip:text}.welcome p{color:var(--muted);margin:0;font-size:14px}
.suggestions{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:20px}.suggestion{background:#111121bb;border:1px solid var(--line);border-radius:14px;padding:14px;text-align:left;color:var(--text);cursor:pointer;transition:.2s}.suggestion:hover{border-color:var(--purple);transform:translateY(-2px)}.suggestion b{display:block;font-size:13px;margin-bottom:5px}.suggestion span{font-size:12px;color:var(--muted)}
.chat{display:flex;flex-direction:column;gap:14px;padding:8px 0 18px}.msg{max-width:86%;padding:13px 16px;border-radius:17px;font-size:14px;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere}.user{align-self:flex-end;background:linear-gradient(135deg,#7047c9,#4b64b7);border-bottom-right-radius:5px}.bot{align-self:flex-start;background:var(--panel2);border:1px solid var(--line);border-bottom-left-radius:5px}.bot strong{color:#c7a8ff}.typing{color:var(--muted);font-size:12px;padding:0 4px}
.composer{position:sticky;bottom:12px;background:#111121;border:1px solid #393454;border-radius:18px;padding:8px;display:flex;gap:8px;box-shadow:0 12px 40px #0008}.composer input{flex:1;min-width:0;background:transparent;border:0;outline:0;color:var(--text);padding:12px;font-size:14px}.composer input::placeholder{color:#777590}.send{border:0;border-radius:13px;background:linear-gradient(135deg,var(--purple),#5d8dff);color:white;font-weight:700;padding:0 19px;cursor:pointer}.send:hover{filter:brightness(1.12)}.note{text-align:center;color:#777590;font-size:11px;margin:11px 0 0}
footer{text-align:center;color:#777590;font-size:11px;padding:12px}
@media(max-width:560px){.app{padding:14px}.suggestions{grid-template-columns:1fr}.msg{max-width:94%}.welcome{margin-top:20px}.status{font-size:10px}}
</style>
</head>
<body>
<div class="app">
<header>
  <div class="brand"><div class="logo">N</div><div><h1>NOVA AI</h1><small>CREATE • THINK • EXPLORE</small></div></div>
  <div class="status">● SYSTEM ONLINE</div>
</header>
<main>
  <section class="welcome" id="welcome">
    <div class="orb">✦</div>
    <h2>Meet <span>NOVA</span></h2>
    <p>Your creative space starts with one question.</p>
  </section>
  <section class="suggestions" id="suggestions">
    <button class="suggestion" data-prompt="Give me 5 creative project ideas"><b>✧ Creative ideas</b><span>Find your next big idea</span></button>
    <button class="suggestion" data-prompt="Teach me a cool coding concept"><b>⌘ Learn coding</b><span>Understand something new</span></button>
    <button class="suggestion" data-prompt="Write a short futuristic story"><b>▣ Write a story</b><span>Make something imaginative</span></button>
    <button class="suggestion" data-prompt="Help me plan my day"><b>◷ Plan my day</b><span>Turn tasks into a simple plan</span></button>
  </section>
  <section class="chat" id="chat" aria-live="polite"></section>
  <form class="composer" id="form">
    <input id="prompt" autocomplete="off" placeholder="Message NOVA..." aria-label="Message NOVA">
    <button class="send" type="submit">Send ↗</button>
  </form>
  <p class="note">NOVA V1 preview · Replies are demo responses, not live AI yet.</p>
</main>
<footer>Designed for curious minds · NOVA AI © 2026</footer>
</div>
<script>
const chat=document.getElementById('chat');
const form=document.getElementById('form');
const input=document.getElementById('prompt');
const welcome=document.getElementById('welcome');
const suggestions=document.getElementById('suggestions');

function addMessage(text,kind){
  const el=document.createElement('div');
  el.className='msg '+kind;
  el.textContent=text;
  chat.appendChild(el);
  el.scrollIntoView({behavior:'smooth',block:'nearest'});
}
function replyTo(text){
  const q=text.toLowerCase();
  if(/hello|hi\b|hey|salaam|assalam/.test(q)) return "Hey! I'm NOVA, your creative assistant interface. What would you like to explore today?";
  if(/code|coding|html|javascript|website|program/.test(q)) return "Let's build something! Tell me what you want the project to do, and I can help you plan the HTML, CSS and JavaScript. This V1 is a front-end demo, so it doesn't connect to a live AI model yet.";
  if(/idea|project|creative/.test(q)) return "Here are 5 ideas to explore:\n1. A personal study dashboard\n2. A mini browser game\n3. A daily habit tracker\n4. A music mood selector\n5. A futuristic portfolio website\n\nPick one and we can build it step by step.";
  if(/story|write/.test(q)) return "At 02:17, the city lights blinked out. One screen stayed on. A message appeared: “You are not the first person to find NOVA.”\n\nWant to turn this into a longer sci-fi story?";
  if(/day|plan|task/.test(q)) return "Try this simple plan:\n1. Choose your most important task.\n2. Work on it for 25 minutes.\n3. Take a short break.\n4. Finish one smaller task.\n5. Review what you completed.\n\nTell me your tasks and I can organize them.";
  if(/thank/.test(q)) return "You're welcome! What's our next creation?";
  return "Interesting question! I'm currently running in demo mode, so I can show sample replies but I can't look things up or reason like a connected AI model yet. We can add a real AI API safely in a later version.";
}
function send(text){
  const value=text.trim();
  if(!value)return;
  welcome.style.display='none';
  suggestions.style.display='none';
  addMessage(value,'user');
  input.value='';
  const typing=document.createElement('div');
  typing.className='typing';typing.textContent='NOVA is thinking…';chat.appendChild(typing);
  setTimeout(()=>{typing.remove();addMessage(replyTo(value),'bot');},550);
}
form.addEventListener('submit',e=>{e.preventDefault();send(input.value);});
document.querySelectorAll('.suggestion').forEach(btn=>btn.addEventListener('click',()=>send(btn.dataset.prompt)));
</script>
</body>
</html>
