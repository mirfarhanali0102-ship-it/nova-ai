<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101116">
<title>NOVA AI V3.1</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101116;color:#f4f4f5;font:15px Arial,sans-serif}
.app{display:flex;height:100dvh;overflow:hidden}.sidebar{width:270px;background:#17181f;padding:14px;display:flex;flex-direction:column;gap:12px}
.brand{font-size:20px;font-weight:700;padding:8px}.new{border:1px solid #454652;background:transparent;color:#fff;border-radius:10px;padding:12px;text-align:left;font-size:15px}
.history{overflow:auto;display:flex;flex-direction:column;gap:6px}.history button{background:transparent;border:0;color:#ddd;text-align:left;padding:10px;border-radius:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.history button.active,.history button:hover{background:#30313a}
.main{flex:1;display:flex;flex-direction:column;min-width:0}.top{padding:16px 20px;border-bottom:1px solid #292a32;font-weight:700}.messages{flex:1;overflow:auto;padding:24px 16px}.welcome{max-width:720px;margin:9vh auto 0;text-align:center}.welcome h1{font-size:30px}.welcome p{color:#aaa}.chips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:22px}.chips span{border:1px solid #393a44;padding:10px 12px;border-radius:20px;color:#ccc}
.message{max-width:760px;margin:0 auto 18px;line-height:1.55;white-space:pre-wrap}.message .who{font-size:12px;color:#a5a5b0;margin-bottom:5px}.message.user{background:#242630;padding:14px;border-radius:14px}
.composer{padding:14px 16px 22px}.form{max-width:760px;margin:auto;display:flex;gap:8px;background:#242630;border:1px solid #41424c;border-radius:16px;padding:8px}.form textarea{flex:1;resize:none;max-height:140px;min-height:42px;background:transparent;border:0;outline:0;color:#fff;padding:12px;font:15px Arial}.form button{border:0;border-radius:12px;background:#f4f4f5;color:#111;padding:0 16px;font-weight:700}.note{text-align:center;color:#858590;font-size:11px;margin-top:10px}
@media(max-width:650px){.sidebar{width:210px;padding:9px}.messages{padding:18px 10px}.top{padding:14px}.welcome h1{font-size:25px}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar">
<div class="brand">✦ NOVA AI</div>
<button class="new" id="newChat">＋ New chat</button>
<div style="color:#92939d;font-size:12px;padding:5px 8px">Recent chats</div>
<div class="history" id="history"></div>
</aside>
<main class="main">
<div class="top">NOVA AI <span style="color:#999;font-weight:400">· V3.1 Preview</span></div>
<section class="messages" id="messages">
<div class="welcome" id="welcome"><h1>How can I help you?</h1><p>Start a conversation with NOVA AI.</p><div class="chips"><span>Explain a topic</span><span>Write something</span><span>Help with ideas</span></div></div>
</section>
<div class="composer">
<form class="form" id="form"><textarea id="prompt" rows="1" placeholder="Message NOVA AI..." required></textarea><button type="submit">Send</button></form>
<div class="note">NOVA AI V3.1 Preview · Demo responses only</div>
</div>
</main>
</div>
<script>
(() => {
const KEY = "nova_ai_v3_multi_chats";
const $ = id => document.getElementById(id);
let chats = [];
let activeId = null;
const makeId = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
function load(){
  try { const data = JSON.parse(localStorage.getItem(KEY) || "[]"); chats = Array.isArray(data) ? data : []; }
  catch { chats = []; }
  chats = chats.filter(c => c && c.id && Array.isArray(c.messages));
  if(chats.length){ activeId = chats[0].id; }
  else { createChat(); }
}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(chats)); } catch(e) { console.warn("Could not save chat history",e); } }
function current(){ return chats.find(c => c.id === activeId); }
function createChat(){
  const chat = {id:makeId(), title:"New chat", messages:[], updated:Date.now()};
  chats.unshift(chat); activeId = chat.id; save(); render();
}
function renderHistory(){
  const host = $("history"); host.innerHTML = "";
  chats.slice().sort((a,b)=>(b.updated||0)-(a.updated||0)).forEach(chat=>{
    const b = document.createElement("button");
    b.textContent = chat.title || "New chat";
    b.className = chat.id === activeId ? "active" : "";
    b.addEventListener("click",()=>{activeId=chat.id;render();});
    host.appendChild(b);
  });
}
function renderMessages(){
  const host = $("messages"); host.innerHTML = "";
  const chat = current();
  if(!chat || !chat.messages.length){
    const welcome=document.createElement("div"); welcome.className="welcome";
    welcome.innerHTML="<h1>How can I help you?</h1><p>Start a conversation with NOVA AI.</p><div class='chips'><span>Explain a topic</span><span>Write something</span><span>Help with ideas</span></div>";
    host.appendChild(welcome); return;
  }
  chat.messages.forEach(m=>{
    const wrap=document.createElement("div"); wrap.className="message"+(m.role==="user"?" user":"");
    const who=document.createElement("div"); who.className="who"; who.textContent=m.role==="user"?"You":"NOVA AI";
    const body=document.createElement("div"); body.textContent=m.text;
    wrap.append(who,body); host.appendChild(wrap);
  });
  host.scrollTop=host.scrollHeight;
}
function render(){renderHistory();renderMessages();}
function demoAnswer(text){
  const q=text.toLowerCase();
  if(q.includes("hello")||q.includes("hi")) return "Hello! I’m NOVA AI. This is the preview version, so my replies are demo responses for now.";
  if(q.includes("image")||q.includes("logo")||q.includes("draw")) return "I can help you plan an image prompt. Live image generation is not connected in this preview yet.";
  return "Thanks for your message! NOVA AI V3.1 is currently in preview mode. Real AI connection will be added through a secure backend in a future update.";
}
$("newChat").addEventListener("click",createChat);
$("form").addEventListener("submit",e=>{
  e.preventDefault();
  const text=$("prompt").value.trim(); if(!text) return;
  if(!current()) createChat();
  const chat=current();
  chat.messages.push({role:"user",text});
  if(chat.title==="New chat") chat.title=text.slice(0,32)+(text.length>32?"…":"");
  chat.messages.push({role:"assistant",text:demoAnswer(text)});
  chat.updated=Date.now(); save(); $("prompt").value=""; render();
});
$("prompt").addEventListener("keydown",e=>{
  if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();$("form").requestSubmit();}
});
load(); render();
})();
</script>
</body>
</html>
