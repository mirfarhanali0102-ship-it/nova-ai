
<script>
const promptBox = document.getElementById("prompt");
const messages = document.getElementById("messages");
const welcome = document.getElementById("welcome");
const chat = document.getElementById("chat");
const historyList = document.getElementById("historyList");
const sendButton = document.getElementById("send");

const STORAGE_KEY = "nova_ai_v4_conversations";

/*
  Keep this empty until your secure backend is deployed.
  Later, set it to your backend URL, such as:
  https://your-worker.example.workers.dev/api/chat

  NEVER put an AI API key here.
*/

const API_ENDPOINT = "";

let conversations = [];
let currentChat = null;
let busy = false;

function createChat() {
  return {
    id: Date.now().toString() + Math.random().toString(36).slice(2),
    title: "New chat",
    messages: [],
    updatedAt: Date.now()
  };
}

// LOAD SAVED CONVERSATIONS

function loadChats() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    const parsed = saved ? JSON.parse(saved) : [];

    if (!Array.isArray(parsed)) {
      conversations = [];
      return;
    }

    conversations = parsed.filter(item =>
      item &&
      typeof item.id === "string" &&
      typeof item.title === "string" &&
      Array.isArray(item.messages)
    );

  } catch (error) {
    console.error("Could not load chat history:", error);
    conversations = [];
  }
}

// SAVE CONVERSATIONS

function saveChats() {
  try {
    localStorage.setItem(
      STORAGE_KEY,
      JSON.stringify(conversations)
    );
    return true;
  } catch (error) {
    console.error("Could not save chat history:", error);
    return false;
  }
}

// NEW CHAT

function newChat() {
  currentChat = createChat();
  conversations.unshift(currentChat);

  saveChats();
  render();

  promptBox.value = "";
  promptBox.focus();

  closeMenu();
}

// ADD MESSAGE

function addMessage(text, type) {
  currentChat.messages.push({
    text,
    type,
    time: Date.now()
  });

  if (
    currentChat.title === "New chat" &&
    type === "user"
  ) {
    currentChat.title = text.slice(0, 35);
  }

  currentChat.updatedAt = Date.now();

  // Put the active conversation first.
  conversations = [
    currentChat,
    ...conversations.filter(c => c.id !== currentChat.id)
  ];

  saveChats();
  render();
}

// RENDER CHAT

function render() {
  welcome.style.display =
    currentChat.messages.length ? "none" : "block";

  messages.innerHTML = "";

  currentChat.messages.forEach(msg => {
    const row = document.createElement("div");
    row.className = "message " + msg.type;

    const avatar = document.createElement("div");
    avatar.className = "avatar";
    avatar.textContent =
      msg.type === "user" ? "U" : "N";

    const content = document.createElement("div");
    content.className = "message-content";
    content.textContent = msg.text;

    row.append(avatar, content);
    messages.appendChild(row);
  });

  historyList.innerHTML = "";

  conversations.forEach(item => {
    const wrapper = document.createElement("div");
    wrapper.style.display = "flex";
    wrapper.style.alignItems = "center";
    wrapper.style.gap = "5px";

    const button = document.createElement("div");

    button.className = "history-item" +
      (item.id === currentChat.id ? " active" : "");

    button.textContent = "✦ " + item.title;
    button.style.flex = "1";
    button.onclick = () => openChat(item.id);

    const remove = document.createElement("button");
    remove.textContent = "×";
    remove.title = "Delete conversation";
    remove.setAttribute(
      "aria-label",
      "Delete " + item.title
    );

    remove.style.cssText =
      "background:transparent;color:#969caf;" +
      "border:0;padding:8px;cursor:pointer;font-size:19px;";

    remove.onclick = event => {
      event.stopPropagation();
      deleteChat(item.id);
    };

    wrapper.append(button, remove);
    historyList.appendChild(wrapper);
  });

  chat.scrollTop = chat.scrollHeight;
}

// OPEN PREVIOUS CHAT

function openChat(id) {
  const selected = conversations.find(c => c.id === id);

  if (!selected) return;

  currentChat = selected;
  render();
  closeMenu();
}

// DELETE CHAT

function deleteChat(id) {
  const selected = conversations.find(c => c.id === id);

  if (!selected) return;

  if (!confirm("Delete this conversation?")) return;

  conversations = conversations.filter(c => c.id !== id);

  if (currentChat.id === id) {
    currentChat = conversations[0] || createChat();

    if (!conversations.length) {
      conversations = [currentChat];
    }
  }

  saveChats();
  render();
}

// SUGGESTION BUTTONS

function ask(text) {
  promptBox.value = text;
  sendMessage();
}

// REAL BACKEND CONNECTION

async function getAIResponse() {
  if (!API_ENDPOINT) {
    return "AI is not connected yet. Your message and chat history have been saved successfully. NOVA AI's secure backend will be connected in a future update.";
  }

  const response = await fetch(API_ENDPOINT, {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({
      messages: currentChat.messages.map(msg => ({
        role: msg.type === "user" ? "user" : "assistant",
        content: msg.text
      }))
    })
  });

  if (!response.ok) {
    throw new Error("Backend request failed: " + response.status);
  }

  const data = await response.json();

  if (typeof data.reply !== "string") {
    throw new Error("Invalid backend response");
  }

  return data.reply;
}

// SEND MESSAGE

async function sendMessage() {
  const text = promptBox.value.trim();

  if (!text || busy) return;

  if (!currentChat) {
    currentChat = createChat();
    conversations.unshift(currentChat);
  }

  addMessage(text, "user");

  promptBox.value = "";
  promptBox.style.height = "40px";

  busy = true;
  sendButton.disabled = true;

  const typing = document.createElement("div");
  typing.className = "typing";
  typing.textContent = "NOVA AI is thinking...";

  messages.appendChild(typing);
  chat.scrollTop = chat.scrollHeight;

  try {
    const answer = await getAIResponse();

    typing.remove();
    addMessage(answer, "bot");

  } catch (error) {
    console.error("AI connection error:", error);

    typing.remove();

    addMessage(
      "I couldn't connect to the AI server. Your message is saved. Please try again later.",
      "bot"
    );

  } finally {
    busy = false;
    sendButton.disabled = false;
    promptBox.focus();
  }
}

// MOBILE SIDEBAR

function toggleMenu() {
  document.getElementById("sidebar")
    .classList.toggle("open");
}

function closeMenu() {
  document.getElementById("sidebar")
    .classList.remove("open");
}

// ENTER TO SEND

promptBox.addEventListener("keydown", event => {
  if (
    event.key === "Enter" &&
    !event.shiftKey
  ) {
    event.preventDefault();
    sendMessage();
  }
});

// AUTO RESIZE INPUT

promptBox.addEventListener("input", () => {
  promptBox.style.height = "40px";

  promptBox.style.height =
    Math.min(promptBox.scrollHeight, 140) + "px";
});

// INITIALIZE APP

loadChats();

if (conversations.length > 0) {
  conversations.sort(
    (a, b) => (b.updatedAt || 0) - (a.updatedAt || 0)
  );

  currentChat = conversations[0];
} else {
  currentChat = createChat();
  conversations.push(currentChat);
}

render();

</script>
